name: Apply Atlas Daily clarity update

on:
  push:
    branches: [main]
    paths:
      - ".update/**"
      - ".github/workflows/apply-clarity-update.yml"

permissions:
  contents: write

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply clarity-flow files
        shell: bash
        run: |
          cat .update/part-* > /tmp/atlas-daily-update.b64
          base64 --decode /tmp/atlas-daily-update.b64 > /tmp/atlas-daily-update.zip
          unzip -oq /tmp/atlas-daily-update.zip -d .
          rm -rf .update
          rm -f .github/workflows/apply-clarity-update.yml

      - name: Commit updated flow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: simplify brain-dump into one clear choice"
          git push
