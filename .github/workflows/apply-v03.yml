name: Apply Atlas Daily v0.3

on:
  push:
    branches: [feature/life-coach-v03]
    paths:
      - ".github/workflows/apply-v03.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble source update
        shell: bash
        run: |
          cat .bootstrap/part-* > /tmp/atlas-v03.b64
          base64 --decode /tmp/atlas-v03.b64 > /tmp/atlas-v03.zip
          unzip -oq /tmp/atlas-v03.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/apply-v03.yml

      - name: Commit life-coach MVP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build guided life-coach goal flow"
          git push
