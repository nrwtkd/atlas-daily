name: Bootstrap Atlas Daily

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble Atlas Daily source
        shell: bash
        run: |
          cat .bootstrap/part-* > /tmp/atlas-daily.b64
          base64 --decode /tmp/atlas-daily.b64 > /tmp/atlas-daily.zip
          unzip -oq /tmp/atlas-daily.zip -d .
          rm -rf .bootstrap

      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Atlas Daily v0.1 source"
          git push
